# Standard Nginx 1.31.8 + ngx_http_acme_module 0.4.1; operator adapts local paths.
# Dedicated private listener: A and B use independent names, EAB and state paths.
load_module /usr/lib/nginx/modules/ngx_http_acme_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    resolver 10.20.0.53 valid=30s;
    resolver_timeout 3s;
    acme_issuer internal_server {
        uri https://ca.internal.example/acme/server/directory;
        accept_terms_of_service;
        challenge http-01;
        state_path /var/lib/nginx/acme-business-a;
        external_account_key REPLACE_WITH_SERVER_GRANT_KID /etc/nginx/private/a-eab;
        ssl_trusted_certificate /etc/nginx/trust/acme-transport-ca.pem;
        ssl_verify on;
    }
    include /etc/nginx/business-acme-challenge.conf;

    # Inherited by EVERY Host-selectable TLS vhost on this dedicated listener.
    ssl_client_certificate /etc/nginx/trust/gateway-client-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/nginx/trust/gateway-client-full-chain.crl.pem;
    # Enable only with the full-chain responder readiness described in the runbook.
    ssl_ocsp on;
    ssl_ocsp_cache shared:client_status:1m;
    ssl_session_cache off;
    ssl_session_tickets off;

    server {
        listen 443 ssl default_server;
        server_name shop.example.com a.internal.example;
        # Explicit identifier: certificate identity is independent of business Host.
        acme_certificate internal_server a.internal.example;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        ssl_certificate_cache max=4 inactive=30s valid=30s;
        if ($host != shop.example.com) { return 421; }
        location / {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
