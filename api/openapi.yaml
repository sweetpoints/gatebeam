  /releases/{id}/publish:
    post:
      summary: Atomically queue a prepared candidate after current revalidation
      description: Rechecks current credential, grants, references, selected revisions, published base and required security materials. Repeated publication queues this candidate at most once. Queued is not effective; no Nginx apply or published-head advancement occurs here.
      security: [{session: []}, {bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '202':
          description: Queue accepted idempotently
          content:
            application/json:
              schema:
                type: object
                required: [id, state, effective]
                properties:
                  id: {type: string, format: uuid}
                  state: {const: queued}
                  effective: {const: false}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  "/sites/{id}/preflight":
    post:
      x-read-only: true
      security: [{session: []}, {bearer: []}]
      summary: Check a published site's old or new entry without changing DNS or access policy
      description: Requires current View scope and normal POST CSRF protection. Performs one bounded read-only HTTPS GET with the published Host and SNI. The result separates direct and Cloudflare paths. Unavailable Cloudflare/AOP/client credentials are explicit preconditions and never a positive probe result.
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationEntry"
      responses:
        "200":
          description: Read-only probe or explicit policy/provider precondition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-gatebeam
      description: Secure HttpOnly SameSite=Strict cookie; development uses gatebeam-dev. Mutations require configured Origin and X-CSRF-Token.
    bearer:
      type: http
      scheme: bearer
      description: High entropy API token. Cannot manage accounts or mint tokens. Mixed cookie and bearer credentials are rejected.
  parameters:
    CertificateKind:
      in: path
      name: kind
      required: true
      schema: {type: string, enum: [spec, account, credential, trust]}
    IngressIdempotency:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Optional 1-128 ASCII letters/digits or ._:-. Scoped to current user, credential, method and canonical path for 24 hours. Same normalized command (including expected_revision) replays resource/revision metadata after live scope reauthorization. Different command returns 409. Failed transactions leave no receipt."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
        maxLength: 128
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CSRF:
      name: X-CSRF-Token
      in: header
      description: Required for cookie authenticated mutations. Sensitive actions additionally require fresh single-use totp_code.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
  responses:
    Error:
      description: Generic request error, without secrets or driver details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    StatisticsSeries:
      type: object
      properties:
        Buckets:
          type: array
          maxItems: 4096
          items:
            type: object
            properties:
              Minute: {type: string, format: date-time}
              SiteID: {type: string, format: uuid}
              Route: {type: string}
              Method: {type: string}
              ConfigID: {type: string}
              StatusClass: {type: integer}
              Count: {type: integer}
              Micros: {type: integer}
              Bytes: {type: integer}
              Histogram: {type: array, minItems: 12, maxItems: 12, items: {type: integer}}
        Count: {type: integer}
        Micros: {type: integer}
        Bytes: {type: integer}
        Histogram: {type: array, minItems: 12, maxItems: 12, items: {type: integer}}
        P50Micros: {type: integer}
        P95Micros: {type: integer}
        IngestedAt: {type: string, format: date-time, description: Zero timestamp if no contributing bucket}
        Approximate: {type: boolean, const: true}
    LogQueryRow:
      type: object
      additionalProperties: false
      properties:
        time: {type: string, format: date-time}
        site_id: {type: string, format: uuid}
        request_id: {type: string}
        route: {type: string}
        method: {type: string}
        status: {type: integer}
        bytes_sent: {type: integer}
        request_micros: {type: integer}
        config_id: {type: string}
    BackupView:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              id: {type: string}
              created_at: {type: string, format: date-time}
              bytes: {type: integer}
              detail_status: {type: string, enum: [recorded, omitted_for_recovery]}
              artifact_verification: {type: string, const: required}
        report_status: {type: string, enum: [recorded, unavailable]}
        local_report:
          oneOf:
            - {$ref: '#/components/schemas/SafeRecoveryReport'}
            - {type: 'null'}
    SafeRecoveryReport:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        artifact_id: {type: string, description: Only recorded after successful artifact Verify}
        at: {type: string, format: date-time}
        stage: {type: string, enum: [configuration, verify, stage]}
        outcome: {type: string, enum: [failed, isolated_staged]}
        cause: {type: string, enum: [configuration_unavailable, artifact_verification_failed, isolated_stage_failed, manual_activation_required]}
        business_activated: {type: boolean, const: false}
    LogQueryFilter:
      type: object
      additionalProperties: false
      required: [SiteIDs, From, To]
      properties:
        source: {type: string, enum: [archive, local], default: archive}
        SiteIDs: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
        From: {type: string, format: date-time}
        To: {type: string, format: date-time}
        Route: {type: string, description: Configured fixed route ordinal/default only}
        Method: {type: string}
        ConfigID: {type: string, description: Fixed immutable config digest}
        Status: {type: integer, description: 0 for all or 100 through 599}
    LogQueryJob:
      type: object
      additionalProperties: false
      properties:
        ID: {type: string, format: uuid}
        State: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        Error: {type: string, enum: ['', denied, capacity, timeout, query_failed]}
        Coverage: {type: string, enum: [local_only, archived_only]}
        ManifestObjects: {type: integer}
        ScanBytes: {type: integer}
        Watermark: {type: integer, description: Archive manifest watermark; local_only uses frozen local objects instead}
        ExpiresAt: {type: string, format: date-time}
        Truncated: {type: boolean, description: False; over-limit engine results fail instead of returning truncated success}
    ExecutionReport:
      type: object
      additionalProperties: false
      properties:
        stage: {type: string, description: Actual reported bounded executor stage, or unavailable for older/unreported jobs}
        cause: {type: string, enum: [none, unavailable, authority_or_preparation_failed, compile_failed, stage_failed, native_validation_failed, activation_or_observation_failed, route_verification_failed, confirmation_failed, restore_failed]}
        updated_at: {type: string, format: date-time}
        job_state: {type: string, enum: [pending, running, completed, failed, unavailable]}
        attempt: {type: integer}
        config_applied: {type: boolean, description: Current database acknowledged runtime receipt; not a live probe}
        route_verification:
          type: object
          description: Present only for current exact artifact/version/generation. Routes are filtered to currently authorized affected closure. Missing or false BusinessVerified remains incomplete. Maintenance/policy refusal is never a healthy backend result.
          properties:
            artifact_id: {type: string}
            version: {type: string}
            generation: {type: string}
            checked_at: {type: string, format: date-time}
            native_verified: {type: boolean}
            business_verified: {type: boolean}
            routes: {type: array, items: {type: object, properties: {site_id: {type: string}, site_revision: {type: integer}, target_id: {type: string}, target_revision: {type: integer}, route: {type: string}, host: {type: string}, sni: {type: string}, path: {type: string}, outcome: {type: string}, reason: {type: string}}}}
    CertificateResource:
      type: object
      required: [id, kind, revision, enabled, body]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [spec, account, credential, trust]}
        revision: {type: integer, minimum: 1}
        enabled: {type: boolean}
        body: {type: object, description: Validated owning Spec/ProviderAccount/DNSCredential/TrustBundle metadata; never secret payloads}
    CertificateResourceWrite:
      type: object
      additionalProperties: false
      required: [expected_revision, config, totp_code]
      properties:
        expected_revision: {type: integer, minimum: 0, description: Zero for create; exact current revision for replace}
        config:
          type: object
          description: 'spec: names/purpose/method/provider_id/challenge/credential_ids/trust_id/trust_revision; account: provider/email/eab_key_id; credential: zone_id/zone_name; trust: purpose/status_profile/origin_pull_authorized. Unknown fields are rejected by owning DTOs; trust fingerprints are derived from PEM.'
        secret: {type: string, maxLength: 4096, writeOnly: true, description: New Cloudflare token or raw base64url EAB HMAC; never returned}
        pem: {type: string, writeOnly: true, description: New public trust PEM for trust resources}
        totp_code: {type: string, writeOnly: true, pattern: '^[0-9]{6}$'}
    CertificateResourceView:
      allOf:
        - {$ref: '#/components/schemas/CertificateResource'}
        - type: object
          properties:
            lifecycle:
              type: object
              properties:
                versions: {type: array, maxItems: 100, items: {type: object, description: "Immutable public version metadata: ID, spec revision, names, purpose, issuer and issuer-key fingerprints, leaf fingerprint, serial, validity, digest, automatic flag and worker enrollment provider"}}
                current_version: {type: string, description: Stored version of current management spec revision, not activation evidence}
                revisions:
                  type: array
                  description: Separate retry state for the current management spec revision and each exact current verified binding revision; historical failures are never attributed to the newer draft.
                  items: {$ref: '#/components/schemas/CertificateRevisionLifecycle'}
                failures: {type: integer}
                next_attempt: {type: string, format: date-time}
                preparing: {type: boolean}
                preparation_failures: {type: integer}
                preparation_next_attempt: {type: string, format: date-time}
                active: {type: array, items: {$ref: '#/components/schemas/VerifiedMaterialBinding'}}
    CertificateRevisionLifecycle:
      type: object
      required: [revision, failures, preparing]
      properties:
        revision: {type: integer, minimum: 1}
        current_version: {type: string, description: Stored version for this immutable spec revision}
        failures: {type: integer, minimum: 0}
        next_attempt: {type: string, format: date-time}
        preparing: {type: boolean}
    VerifiedMaterialBinding:
      type: object
      description: Exact immutable material identity recorded in the same final verified deployment transaction. Empty legacy/current receipt does not imply active. Historical published spec revisions may remain active while a newer current management revision is pending.
      properties:
        spec_revision: {type: integer}
        version_id: {type: string}
        digest: {type: string}
        artifact_id: {type: string}
        version: {type: string}
        generation: {type: string}
        verified_at: {type: string, format: date-time}
    MigrationEntry:
      type: object
      additionalProperties: false
      required: [role, mode, address, path]
      properties:
        role: {type: string, enum: [old, new]}
        mode: {type: string, enum: [direct, cloudflare]}
        address:
          type: string
          description: Literal IPv4 or bracketed IPv6 address with the explicit TLS port; control, metadata, loopback and link-local addresses are refused.
          examples: ["203.0.113.10:443", "[2001:db8::10]:8443"]
        domain:
          type: string
          description: One exact published domain; defaults to the first published domain. Used independently for HTTP Host and TLS SNI verification.
        path:
          type: string
          maxLength: 2048
          pattern: '^/[^?#]*$'
          description: Operator-selected read-only GET path; no query, fragment, authority or request body.
    MigrationReport:
      type: object
      required: [site_id, revision, entry, ready, result]
      properties:
        site_id: {type: string, format: uuid}
        revision: {type: integer, format: int64}
        entry:
          $ref: "#/components/schemas/MigrationEntry"
        ready: {type: boolean}
        result: {type: string, enum: [passed, failed, policy_refused, unavailable]}
        reason:
          type: string
          enum: [cloudflare_provider_unavailable, cloudflare_aop_or_client_certificate_required, tls_or_http_probe_failed]
    ReleaseChange:
      type: object
      additionalProperties: false
      required: [kind, id, before, after, fields]
      properties:
        fields: {type: array, items: {type: string}, description: Changed top-level configuration keys only; all values redacted}
        kind: {type: string, enum: [site, target]}
        id: {type: string, format: uuid}
        before: {type: integer, minimum: 0}
        after: {type: integer, minimum: 1}
    ReleaseDiff:
      type: object
      additionalProperties: false
      required: [id, input_digest, affected_site_ids, changes]
      properties:
        id: {type: string, format: uuid}
        input_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        affected_site_ids: {type: array, items: {type: string, format: uuid}}
        changes: {type: array, items: {$ref: '#/components/schemas/ReleaseChange'}}
    ReleaseCandidate:
      type: object
      additionalProperties: false
      required: [id, input_digest, affected_site_ids, changes, state, effective]
      properties:
        id: {type: string, format: uuid}
        input_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        affected_site_ids: {type: array, items: {type: string, format: uuid}}
        changes: {type: array, items: {$ref: '#/components/schemas/ReleaseChange'}}
        state: {type: string, enum: [prepared, queued, preparing, validated, applying, verifying, succeeded, failed, restoring, restored, restore_failed], description: Authoritative persisted release state. Current executor may retain queued until a terminal receipt; intermediate execution phase and typed failure cause are unavailable unless explicitly reported.}
        effective: {type: boolean, description: This is the current database-acknowledged verified release, not a live process probe; queue submission is false}
        execution: {$ref: '#/components/schemas/ExecutionReport'}
        observed_version: {type: string, description: Last acknowledged native version probe for this release; empty before execution}
        restored_version: {type: string, description: Recovery version metadata. Only explicit state restored confirms verified restoration; restore_failed may retain an unverified observed version. Never infer recovery success from a nonempty field.}
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
    UUID: {type: string, format: uuid}
    Role: {type: string, enum: [readonly, editor, publisher, admin]}
    Action: {type: string, enum: [view, edit, publish]}
    Grant:
      type: object
      required: [kind, resource_id]
      properties:
        kind: {type: string, enum: [site, group]}
        resource_id: {type: string, format: uuid}
    Actor:
      type: object
      required: [user_id, role, auth_version, credential_kind, credential_id]
      properties:
        user_id: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/Role"}
        auth_version: {type: integer, format: int64}
        credential_kind: {type: string, enum: [session, token]}
        credential_id: {type: string, format: uuid}
    Account:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        state: {type: string, enum: [pending, active, disabled]}
        auth_version: {type: integer, format: int64}
    Token:
      type: object
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        actions: {type: array, items: {$ref: "#/components/schemas/Action"}}
        site_ids: {type: array, items: {type: string, format: uuid}}
        expires: {type: string, format: date-time}
        revoked: {type: boolean}
    IssuedToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Shown only in this successful creation response; persist securely.}
    Audit:
      type: object
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string}
        occurred_at: {type: string, format: date-time}
    LoginChallenge:
      type: object
      properties:
        challenge_id: {type: string}
        expires: {type: string, format: date-time}
    Enrollment:
      type: object
      properties:
        invite_id: {type: string}
        provisioning_uri: {type: string}
        expires: {type: string, format: date-time}
    RecoveryCodes:
      type: object
      properties:
        recovery_codes: {type: array, items: {type: string}}
    Session:
      type: object
      properties:
        actor: {$ref: "#/components/schemas/Actor"}
        csrf_token: {type: string}
        expires: {type: string, format: date-time}

    IngressRevision:
      type: "object"
      additionalProperties: false
      properties:
        resource_id:
          "$ref": "#/components/schemas/UUID"
        number:
          type: "integer"
          minimum: 1
      required: ["resource_id", "number"]
    IngressMaterialRef:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        revision:
          type: "integer"
          minimum: 1
        status:
          type: "string"
          enum: ["unavailable"]
          description: "P5 is not yet available. No TLS readiness or material is implied."
      required: ["id", "revision", "status"]
    IngressTargetRef:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
    IngressRate:
      type: "object"
      additionalProperties: false
      properties:
        requests_per_second: {type: integer, minimum: 0, maximum: 1000000}
        burst: {type: integer, minimum: 0, maximum: 1000000}
        connections: {type: integer, minimum: 0, maximum: 1000000}
        status: {type: integer, enum: [429, 503]}
    IngressRoute:
      type: "object"
      additionalProperties: false
      properties:
        match:
          type: "string"
          enum: ["exact", "prefix"]
        path:
          type: "string"
          maxLength: 2048
          pattern: "^/"
        rate:
          "$ref": "#/components/schemas/IngressRate"
        strip_prefix:
          type: "boolean"
        target:
          "$ref": "#/components/schemas/IngressTargetRef"
      required: ["match", "path", "target"]
    IngressCreationCapabilities:
      type: object
      additionalProperties: false
      required: [create_site_group_ids, create_ungrouped_site, create_target, manage_groups]
      properties:
        create_site_group_ids: {type: array, maxItems: 100, items: {type: string, format: uuid}}
        create_ungrouped_site: {type: boolean}
        create_target: {type: boolean}
        manage_groups: {type: boolean}
    IngressSiteConfig:
      type: "object"
      additionalProperties: false
      properties:
        enabled:
          type: "boolean"
          description: "Defaults true only when omitted during creation. Full draft PUT requires an explicit boolean; false stages deactivation without changing published traffic."
        domains:
          type: "array"
          items:
            type: "string"
            maxLength: 253
          maxItems: 100
          minItems: 1
          description: "Normalized lowercase ASCII names; global uniqueness includes draft and published heads."
        default_target:
          "$ref": "#/components/schemas/IngressTargetRef"
        routes:
          type: "array"
          items:
            "$ref": "#/components/schemas/IngressRoute"
          maxItems: 500
        maintenance:
          type: "object"
          additionalProperties: false
          properties:
            enabled:
              type: "boolean"
            status:
              type: "integer"
              minimum: 400
              maximum: 599
            message:
              type: "string"
              maxLength: 1024
        cloudflare:
          type: "object"
          additionalProperties: false
          properties:
            mode:
              type: "string"
              enum: ["off", "proxied"]
            trusted_proxy_networks:
              type: "array"
              items:
                type: "string"
              maxItems: 1000
            require_origin_pull:
              type: "boolean"
        entry_certificate:
          "$ref": "#/components/schemas/IngressMaterialRef"
        client_verification:
          type: "object"
          additionalProperties: false
          properties:
            mode:
              type: "string"
              enum: ["off", "optional", "required"]
            trust:
              "$ref": "#/components/schemas/IngressMaterialRef"
            depth:
              type: "integer"
              minimum: 0
              maximum: 10
            revocation:
              type: "string"
              enum: ["", "crl", "ocsp", "crl_ocsp"]
        access:
          type: "object"
          additionalProperties: false
          properties:
            allow:
              type: "array"
              items:
                type: "string"
              maxItems: 1000
            deny:
              type: "array"
              items:
                type: "string"
              maxItems: 1000
            deny_paths:
              type: "array"
              items:
                type: "string"
        rate:
          type: "object"
          additionalProperties: false
          properties:
            requests_per_second:
              type: "integer"
              minimum: 0
              maximum: 1000000
            burst:
              type: "integer"
              minimum: 0
              maximum: 1000000
            connections:
              type: "integer"
              minimum: 0
              maximum: 1000000
            status:
              type: "integer"
              enum: [429, 503]
        connection:
          type: "object"
          additionalProperties: false
          properties:
            connect_timeout_seconds:
              type: "integer"
              minimum: 0
              maximum: 300
            read_timeout_seconds:
              type: "integer"
              minimum: 0
              maximum: 3600
            send_timeout_seconds:
              type: "integer"
              minimum: 0
              maximum: 3600
            max_body_bytes:
              type: "integer"
              minimum: 0
              maximum: 1099511627776
            websocket:
              type: "boolean"
            sse:
              type: "boolean"
            buffer_responses:
              type: "boolean"
      required: ["domains"]
    IngressTargetConfig:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 128
        protocol:
          type: "string"
          enum: ["http", "https"]
        members:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              address:
                type: "string"
                description: "Connection FQDN or explicitly allowed private address; DNS resolution/worker validation is deferred to runtime implementation."
              port:
                type: "integer"
                minimum: 1
                maximum: 65535
              weight:
                type: "integer"
                minimum: 1
                maximum: 1000
              tls_name:
                type: "string"
                description: "SNI and verification name, separate from connection address and HTTP Host."
            required: ["address", "port", "weight"]
          maxItems: 100
          minItems: 1
        http_host:
          type: "string"
          description: "Empty preserves business Host. This field is independent of address and TLS name."
        tls_server_name_mode:
          type: string
          enum: ["", send, verify_only]
          description: Default sends SNI. verify_only keeps TLS hostname verification but omits wire SNI; requires a client certificate and a dedicated uniformly protected native mTLS listener.
        tls_name_mode:
          type: "string"
          enum: ["", "fixed", "member"]
        tls_name:
          type: "string"
        trust:
          "$ref": "#/components/schemas/IngressMaterialRef"
        client_certificate:
          "$ref": "#/components/schemas/IngressMaterialRef"
        allowed_networks:
          type: "array"
          items:
            type: "string"
          maxItems: 100
          minItems: 1
          description: "Explicit subnets of RFC1918 or IPv6 ULA only; protected resolved targets must be rejected at runtime."
        health:
          type: "object"
          additionalProperties: false
          properties:
            enabled:
              type: "boolean"
            http_host:
              type: "string"
            path:
              type: "string"
            interval_seconds:
              type: "integer"
              minimum: 0
              maximum: 3600
            timeout_seconds:
              type: "integer"
              minimum: 0
              maximum: 60
            healthy_threshold:
              type: "integer"
              minimum: 0
              maximum: 100
            unhealthy_threshold:
              type: "integer"
              minimum: 0
              maximum: 100
      required: ["name", "protocol", "members", "allowed_networks"]
    IngressSite:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        name:
          type: "string"
        group_ids:
          type: "array"
          items:
            "$ref": "#/components/schemas/UUID"
          maxItems: 100
        revision:
          type: "integer"
          minimum: 1
        draft:
          "$ref": "#/components/schemas/IngressSiteConfig"
        published_revision:
          type: "integer"
          minimum: 0
        published:
          "$ref": "#/components/schemas/IngressSiteConfig"
      required: ["id", "name", "group_ids", "revision", "draft", "published_revision"]
    IngressTarget:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        revision:
          type: "integer"
          minimum: 1
        config:
          "$ref": "#/components/schemas/IngressTargetConfig"
        published_revision:
          type: "integer"
          minimum: 0
        published:
          "$ref": "#/components/schemas/IngressTargetConfig"
      required: ["id", "revision", "config", "published_revision"]
    IngressGroup:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/UUID"
        name:
          type: "string"
        revision:
          type: "integer"
          minimum: 1
      required: ["id", "name", "revision"]
