    get:
      summary: Read current authorized release/version metadata
      security: [{session: []}, {bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Redacted metadata with queue/effective state kept separate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseCandidate'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
