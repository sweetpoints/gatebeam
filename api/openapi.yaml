  /releases/prepare:
    post:
      summary: Prepare an immutable scoped release candidate
      description: Select drafts explicitly with site:<uuid> and target:<uuid> revision keys. Other sites and targets retain published versions. Current credential and complete draft/published reference permissions are checked; full snapshots never appear in the response. Required TLS materials are unavailable until the certificate provider is implemented.
      security: [{session: []}, {bearer: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_ids, expected]
              properties:
                site_ids: {type: array, items: {type: string, format: uuid}}
                expected:
                  type: object
                  propertyNames: {pattern: '^(site|target):[0-9a-f-]{36}$'}
                  additionalProperties: {type: integer, minimum: 1}
      responses:
        '201':
          description: Immutable candidate prepared; traffic is unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseCandidate'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /releases/{id}/prepare-historical:
    post:
      summary: Prepare a fresh candidate from a verified historical logical version
      description: Source must have verified succeeded state. Selected logical configurations come from the historical source; expected keys guard current heads. Current groups and security bindings remain authoritative, deleted resources cannot revive, and current draft/published domain claims cannot be reclaimed. Select resources explicitly with site:<uuid> and target:<uuid> revision keys. Other sites and targets retain published versions. Current credential and complete draft/published reference permissions are checked; full snapshots never appear in the response. Required TLS materials are unavailable until the certificate provider is implemented.
      security: [{session: []}, {bearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_ids, expected]
              properties:
                site_ids: {type: array, items: {type: string, format: uuid}}
                expected:
                  type: object
                  propertyNames: {pattern: '^(site|target):[0-9a-f-]{36}$'}
                  additionalProperties: {type: integer, minimum: 1}
      responses:
        '201':
          description: Immutable candidate prepared; traffic is unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseCandidate'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /releases:
    get:
      summary: List currently authorized candidate/version metadata
      description: Bounded creation-time page. Each item rechecks current credential, grants and references; unauthorized items are omitted. Follow has_more/next_offset even for an empty visible page. At most limit+1 raw rows are read per request; no denied metadata or totals are returned. Offset traversal is bounded to 100000. No configuration body or secret is returned.
      security: [{session: []}, {bearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200':
          description: Authorized metadata
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, has_more, next_offset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ReleaseCandidate'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
                  next_offset: {type: [integer, "null"], minimum: 1, maximum: 100000}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
