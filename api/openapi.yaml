openapi: 3.1.0
info:
  title: Gatebeam Management API
  version: 0.1.0
  description: Management REST only. Certificate issuance uses standard ACME v2, OCSP and CRL protocols in their own adapters.
servers:
  - url: /
security:
  - session: []
paths:
  /statistics/query:
    post:
      summary: Query current-authorized minute statistics
      description: Maximum 100 sites and 24 hours, minute-aligned UTC bounds. No SQL. IngestedAt is the latest contributing bucket ingestion time, not proof all records were collected. Percentiles are histogram approximations.
      security: [{session: []}, {bearer: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [SiteIDs, From, To]
              properties:
                SiteIDs: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                From: {type: string, format: date-time}
                To: {type: string, format: date-time}
                Route: {type: string}
                Method: {type: string}
                ConfigID: {type: string}
                StatusClass: {type: integer, minimum: 0, maximum: 5}
      responses:
        '200':
          description: Bounded approximate statistics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatisticsSeries'}
        '400': {description: Invalid bounded filter}
        '403': {description: Current credential or site denied}
        '413': {description: Capacity exceeded}
        '503': {description: Statistics unavailable}
  /log-queries:
    post:
      summary: Submit a frozen bounded asynchronous historical query
      description: Full current actor credential and current site access are checked at submit and execution. Source selects archive (default) or local only; no SQL, object keys, URLs or paths accepted. Queue capacity 64, expiry 10 minutes; maximum 31 days, 4096 objects, 2 GiB scan, 10000 returned rows. Over-limit execution fails without partial-success rows. Local immutable objects are pinned while queued/running; query-worker checks size/SHA256 of opened immutable file descriptors under its configured read-only spool root. API has no executor socket or R2 credentials.
      security: [{session: []}, {bearer: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogQueryFilter'}
      responses:
        '202':
          description: Persisted queued job; neither complete nor full coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogQueryJob'}
        '400': {description: Invalid bounded filter}
        '403': {description: Current credential or site denied}
        '413': {description: Admission scan/object/queue limit exceeded}
    get:
      summary: List this exact credential's unexpired query jobs
      description: Bounded raw-window pagination; current authorization is checked again. Reads at most limit+1 exact-credential rows. Removed site scope may leave items empty while has_more is true; follow next_offset rather than inferring completion from visible item count. No unauthorized job identities, object keys or publisher credential payloads.
      security: [{session: []}, {bearer: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Authorized query task page
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/LogQueryJob'}}, limit: {type: integer}, offset: {type: integer}, has_more: {type: boolean, description: More raw rows exist beyond the scanned window even when all visible items were filtered}, next_offset: {type: integer, minimum: 0, description: Authoritative next raw offset when has_more is true; otherwise zero}}}
        '403': {description: Current authority denied}
  /log-queries/{id}:
    get:
      summary: Fetch one authorized 100-row result page
      description: Exact full ActorRef must match submission, then current credential and every current site are rechecked even when job ID and cursor are known. Coverage remains local_only or archived_only; succeeded means fixed-query execution succeeded, never complete ingestion coverage.
      security: [{session: []}, {bearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, description: Opaque offset returned by server; multiples of 100}}
      responses:
        '200':
          description: Authorized query result page
          content:
            application/json:
              schema: {type: object, properties: {Job: {$ref: '#/components/schemas/LogQueryJob'}, Rows: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/LogQueryRow'}}, Cursor: {type: string}}}
        '400': {description: Invalid cursor}
        '403': {description: Unknown job or current access denied}
        '409': {description: Expired query}
  /log-queries/{id}/cancel:
    post:
      summary: Cancel this credential's queued/running query
      description: Same current credential/site checks as fetch. Durable cancelled state fences late worker completion. Repeated cancellation or terminal jobs leave the terminal result unchanged.
      security: [{session: []}, {bearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: Cancel receipt persisted}
        '403': {description: Current credential or site denied}
  /log-queries/{id}/download:
    get:
      summary: Download the bounded completed JSON result
      description: Current exact credential/site access is rechecked on every page before writing response bytes. No signed URL or token can bypass current authorization. Only succeeded jobs; Cache-Control no-store.
      security: [{session: []}, {bearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Attachment gatebeam-logs.json; never proof of complete ingestion coverage
          content:
            application/json:
              schema: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/LogQueryRow'}}
        '403': {description: Unknown job or current authority denied}
        '409': {description: 'Unfinished, failed, cancelled or expired job'}
  /backups:
    get:
      summary: Read delivery receipts and last local recovery command report
      description: Current interactive administrator only. Read-only; no remote restore, key upload or artifact paths. A backup receipt always has artifact_verification required; omitted historical details have detail_status omitted_for_recovery. The fixed locally configured safe report spool is mounted read-only into API. Report failure remains visible after refresh. isolated_staged requires manual activation and never sets business_activated true.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Safe delivery receipts and local command report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupView'}
        '403': {description: Current interactive administrator required}
  /alert-channels:
    get:
      summary: Read up to 100 channel metadata records without consuming TOTP
      description: Current interactive administrator required. No secret or ciphertext readback; Cache-Control no-store.
      responses:
        "200": {description: Channel metadata array}
        "403": {description: Current administrator required}
        "503": {description: Query unavailable}
    put:
      summary: Create or update a persistent notification channel
      description: Current interactive administrator, CSRF and fresh single-use TOTP. Body has channel, expected_revision, optional write-only secret, and totp. New owner is assigned from the authenticated administrator; existing owner is retained. Channel requires kind telegram or smtp, enabled, recipient, and either nonempty site_ids or system true. Empty recipient is explicitly non-sending. SMTP requires host, port, from and tls_mode starttls or implicit. No arbitrary message or provider URL. A successful write commits encrypted credentials and audit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, expected_revision, totp]
              properties:
                channel: {type: object}
                expected_revision: {type: integer, minimum: 0}
                secret: {type: string, writeOnly: true, maxLength: 4096}
                totp: {type: string, writeOnly: true}
      responses:
        "200": {description: 'Saved channel metadata, never credentials'}
        "400": {description: Invalid request}
        "403": {description: Current administrator and unused MFA required}
        "409": {description: Revision conflict}
        "503": {description: Operation unavailable}
  /alert-channels/{id}/test:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    post:
      summary: Queue a fixed safe asynchronous channel test
      description: Current interactive administrator, CSRF and fresh TOTP. External delivery occurs only in worker and rechecks current channel and persistent owner authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [totp], properties: {totp: {type: string, writeOnly: true}}}
      responses:
        "202": {description: 'Safe test and audit durably queued, not yet delivered'}
        "403": {description: Current administrator and unused MFA required}
        "503": {description: Queue unavailable}
  /alerts:
    get:
      summary: Read up to 100 incidents and 100 recent per-channel delivery outcomes
      description: Current interactive administrator only. Fixed state/error codes and sanitized event kind/state/lag; no resource identity, site details, raw message, secret or provider response. Does not consume TOTP.
      responses:
        "200": {description: Safe incidents and deliveries arrays; incidents remain visible without configured channels}
        "403": {description: Current administrator required}
        "503": {description: Query unavailable}
  /certificates/{kind}:
    parameters:
      - {$ref: '#/components/parameters/CertificateKind'}
    get:
      summary: List safe certificate resource metadata and lifecycle state
      security: [{session: []}, {bearer: []}]
      description: At most 1000 current resources. Rechecks current credential and View on every affected draft and published site under the normal identity, ingress, certificate lock order. A resource with no affected site requires interactive global administrator authority. Inaccessible resources are omitted. Metadata only; no network probe or secret readback. Stored current versions and exact final verified deployment bindings are distinct.
      responses:
        "200":
          description: Authorized resource metadata only
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/CertificateResourceView'}}}}
        "403": {description: Current credential denied}
        "503": {description: Query unavailable}
    post:
      summary: Create and explicitly enable a certificate resource for background preparation
      description: Current interactive administrator, CSRF and fresh single-use TOTP required. Owning application validates all current references. Network preparation is asynchronous in the separate worker, not this request. Internal account directories derive only from trusted ca_origin. Public providers are letsencrypt, zerossl and google; no automatic provider failover. Successful import spec or trust creation is not publication or native application confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateResourceWrite'}
      responses:
        "201": {description: Resource and audit committed; preparation may still be pending, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateResource'}}}}
        "400": {description: Invalid resource or enrollment policy}
        "403": {description: Current administrator or fresh MFA proof required}
        "409": {description: Revision conflict or referenced material unavailable}
        "503": {description: Operation unavailable; no success reported}
  /certificates/{kind}/{id}:
    parameters:
      - {$ref: '#/components/parameters/CertificateKind'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read one currently authorized certificate resource
      security: [{session: []}, {bearer: []}]
      responses:
        "200": {description: 'Safe resource metadata with stored versions, preparation/retry state and exact verified bindings', content: {application/json: {schema: {$ref: '#/components/schemas/CertificateResourceView'}}}}
        "403": {description: Resource unavailable or not completely authorized}
        "503": {description: Query unavailable}
    put:
      summary: Save an immutable new resource revision and explicitly enable it
      description: Same authority and secret rules as creation. expected_revision must match. Scope checks freeze all old draft and published references plus new dependencies. Configuration/import replacements require manual publication. Account and credential replacement require new secret input; existing secret data is never recovered.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateResourceWrite'}
      responses:
        "200": {description: New immutable revision and audit committed, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateResource'}}}}
        "400": {description: Invalid configuration}
        "403": {description: Current administrator or fresh MFA proof required}
        "409": {description: Revision conflict or unavailable dependency}
        "503": {description: Operation unavailable}
  /certificates/{kind}/{id}/enabled:
    parameters:
      - {$ref: '#/components/parameters/CertificateKind'}
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Enable or disable a resource with current revision and fresh MFA
      description: All-reference authorization and durable audit commit before success. Enable authorizes worker preparation. Disable is distinct from PKI principal disable and from revoking a single issued certificate; it is not a synchronous network or native activation result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, enabled, totp_code]
              properties:
                expected_revision: {type: integer, minimum: 1}
                enabled: {type: boolean}
                totp_code: {type: string, writeOnly: true, pattern: '^[0-9]{6}$'}
      responses:
        "204": {description: Enabled state and audit committed}
        "400": {description: Invalid request}
        "403": {description: Administrator/fresh MFA/scope denied}
        "409": {description: Current resource revision changed}
        "503": {description: Operation unavailable}
  /certificates/spec/{id}/import:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Import an externally issued certificate chain and private key
      description: Only enabled import specs; no CSR or signing endpoint. Current interactive administrator, CSRF, all-reference scope and fresh single-use TOTP required. Inspect names, usage, chain and validity; seal key to leaf public recipient. Cannot replace a stored version in the same spec revision; save a new spec revision and manually publish. Imports never automatically renew. Request body is never logged or read back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificate_pem, private_key_pem, totp_code]
              properties:
                certificate_pem: {type: string, writeOnly: true}
                private_key_pem: {type: string, writeOnly: true}
                totp_code: {type: string, writeOnly: true, pattern: '^[0-9]{6}$'}
      responses:
        "201": {description: Immutable public version metadata; no key/material reference readback}
        "400": {description: 'Invalid material, purpose, names or chain'}
        "403": {description: Administrator/fresh MFA/scope denied}
        "409": {description: Existing version requires a new manually published spec revision}
        "503": {description: Operation unavailable}
  /auth/login:
    post:
      summary: Begin password proof
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password]
              properties:
                name:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login/finish:
    post:
      summary: Complete fresh TOTP proof and set HttpOnly session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, code]
              properties:
                challenge_id:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/enroll:
    post:
      summary: Enroll pending account with its own TOTP and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invite_id, password, code]
              properties:
                invite_id:
                  type: string
                password:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/recover:
    post:
      summary: Consume single use recovery proof and require fresh enrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, password, recovery_code]
              properties:
                name:
                  type: string
                password:
                  type: string
                recovery_code:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      security:
        - session: []
        - bearer: []
      summary: Authenticate current session or API token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke current session with CSRF proof
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /accounts/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Administrator resets account and requires enrollment
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totp_code]
              properties:
                totp_code:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /accounts/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Administrator disables account immediately
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totp_code]
              properties:
                totp_code:
                  type: string
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /accounts/{id}/authority:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      summary: Administrator replaces current role and site or group grants
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totp_code, role, grants]
              properties:
                totp_code:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
                grants:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/Grant"
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /tokens/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Owner or administrator revokes token immediately
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totp_code]
              properties:
                totp_code:
                  type: string
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /accounts:
    get:
      summary: List accounts (administrator)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Bounded page ordered by stable ID (audit by time and ID descending)
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, request_id]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  limit: {type: integer}
                  offset: {type: integer}
                  request_id: {type: string}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      summary: Create pending account; creator never supplies new account MFA
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, role, totp_code]
              properties:
                name:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
                totp_code:
                  type: string
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /tokens:
    get:
      summary: List own token metadata, never raw bearer
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Bounded page ordered by stable ID (audit by time and ID descending)
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, request_id]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
                  limit: {type: integer}
                  offset: {type: integer}
                  request_id: {type: string}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      summary: Issue own scoped token once; fresh TOTP and interactive session required
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totp_code, actions, site_ids, expires]
              properties:
                totp_code:
                  type: string
                actions:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/Action"
                site_ids:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/UUID"
                expires:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
