# Local development database only; never use for persistent gateway data.
name: gatebeam-development
services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: gatebeam
      POSTGRES_USER: gatebeam
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql:size=512m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gatebeam -d gatebeam"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
