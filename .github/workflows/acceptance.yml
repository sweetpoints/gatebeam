name: Gatebeam acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatebeam-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release_plan:
    name: Check the declared release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/public_release.py plan

  full20:
    needs: release_plan
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'push' ||
      (needs.release_plan.result == 'success' && needs.release_plan.outputs.version == ''))
    name: Full acceptance / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GATEBEAM_TARGET_ARCH: ${{ matrix.arch }}
      GATEBEAM_ACCEPTANCE_EXECUTION: native
      GATEBEAM_ACCEPTANCE_KEEP_GOING: '1'
      GATEBEAM_BROWSER_CHANNEL: chromium
      GATEBEAM_TEST_OPENSSL: /usr/bin/openssl
      GOTOOLCHAIN: local
      PNPM_CONFIG_MANAGE_PACKAGE_MANAGER_VERSIONS: 'false'
      COMPOSE_ANSI: never
      COMPOSE_PROGRESS: plain
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/native-acceptance

      - name: Verify complete same-commit acceptance
        run: python3 scripts/public_release.py verify

  release_amd64:
    name: Release amd64
    needs: release_plan
    if: needs.release_plan.outputs.version != ''
    uses: ./.github/workflows/release-platform.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      architecture: amd64
      runner: ubuntu-24.04
      version: ${{ needs.release_plan.outputs.version }}
      tag: ${{ needs.release_plan.outputs.tag }}

  release_arm64:
    name: Release arm64
    needs: release_plan
    if: needs.release_plan.outputs.version != ''
    uses: ./.github/workflows/release-platform.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      architecture: arm64
      runner: ubuntu-24.04-arm
      version: ${{ needs.release_plan.outputs.version }}
      tag: ${{ needs.release_plan.outputs.tag }}

  publish:
    name: Publish verified GHCR indexes
    needs: [release_plan, release_amd64, release_arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gatebeam-ghcr-${{ needs.release_plan.outputs.tag }}
      cancel-in-progress: false
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.release_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.release_plan.outputs.tag }}
      DIGESTS_AMD64: ${{ needs.release_amd64.outputs.images }}
      DIGESTS_ARM64: ${{ needs.release_arm64.outputs.images }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare registry client
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
      - name: Publish only the verified version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$DOCKER_CONFIG/config.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          python3 scripts/public_release.py publish
